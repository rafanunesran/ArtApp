name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.2.12479018

jobs:
  test:
    name: Testes (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema (winit/X11)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # O runner ubuntu já traz o Android SDK; só instalamos o NDK e a plataforma que usamos.
      - name: NDK e plataforma
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Compilar libartapp.so
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          cargo ndk -t arm64-v8a -t x86_64 -P 26 -o android/app/src/main/jniLibs build --release -p artapp --lib
      - uses: gradle/actions/setup-gradle@v4
      - name: Empacotar APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: artapp-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Versões para computador: Windows (.zip com o .exe), Linux (.tar.gz com instalador) e macOS
  # (.zip com o ArtApp.app, Apple Silicon e Intel).
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ArtApp-Windows-x64.zip
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: ArtApp-Linux-x64.tar.gz
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            asset: ArtApp-macOS-AppleSilicon.zip
          - name: macOS Intel
            os: macos-14
            target: x86_64-apple-darwin
            asset: ArtApp-macOS-Intel.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Compilar
        run: cargo build --release -p artapp --bin artapp --target ${{ matrix.target }}
      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/ArtApp | Out-Null
          Copy-Item target/${{ matrix.target }}/release/artapp.exe dist/ArtApp/ArtApp.exe
          Compress-Archive -Path dist/ArtApp -DestinationPath ${{ matrix.asset }}
      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/ArtApp
          cp target/${{ matrix.target }}/release/artapp packaging/linux/artapp.desktop packaging/linux/install.sh dist/ArtApp/
          tar -C dist -czf ${{ matrix.asset }} ArtApp
      - name: Empacotar (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          APP=dist/ArtApp.app/Contents
          mkdir -p "$APP/MacOS"
          cp target/${{ matrix.target }}/release/artapp "$APP/MacOS/artapp"
          sed "s/VERSION/${VERSION}/g" packaging/macos/Info.plist > "$APP/Info.plist"
          # Assinatura ad-hoc: sem ela o macOS em Apple Silicon recusa abrir o app.
          codesign --force --deep -s - dist/ArtApp.app
          (cd dist && ditto -c -k --keepParent ArtApp.app ../${{ matrix.asset }})
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # Cada push na main que passa nos testes vira uma release pública com o APK, para que o
  # site (GitHub Pages) possa apontar para releases/latest/download/ArtApp.apk.
  release:
    name: Release (APK e desktop)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, apk, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: artapp-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          cp apk/*.apk ArtApp.apk
          gh release create "$TAG" ArtApp.apk desktop/* \
            --target "$GITHUB_SHA" \
            --title "ArtApp ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK e versões para Windows, Linux e macOS gerados automaticamente a partir de ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            --latest
