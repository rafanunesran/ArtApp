name: Relatórios de erro

# Busca os relatórios de erro que o app envia (ntfy.sh guarda 12 h), agrupa por tipo, grava em
# relatorios.json no ramo `relatorios-de-erros` (lido pela página /erros/ do site) e abre/comenta
# issues com o rótulo `erro-do-app`. Ver docs/relatorios-de-erros.md.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: crash-reports
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Ramo dos dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin relatorios-de-erros; then
            git worktree add dados FETCH_HEAD
            git -C dados checkout -B relatorios-de-erros
          else
            git worktree add --detach dados
            git -C dados checkout --orphan relatorios-de-erros
            git -C dados rm -rfq .
            printf '# Relatórios de erro do ArtApp\n\nDados gerados pelo workflow `crash-reports.yml`. Veja https://rafanunesran.github.io/ArtApp/erros/\n' > dados/README.md
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar e agrupar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/crash-reports.mjs dados
      - name: Gravar
        working-directory: dados
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "Relatórios de erro $(date -u +'%Y-%m-%d %H:%M')"
          git push origin relatorios-de-erros
